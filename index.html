<!DOCTYPE html>
    <html lang="en">
<head>
      <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Auto OS - System</title>
      <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
      <body>
    <div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>
        <div class="hero-bg"></div>
    <div class="scanlines"></div>
  <div class="vignette"></div>
   <main class="boot-screen" id="bootScreen">
 <div class="rpm-gauge">
    <div class="needle" id="needle"></div>
   <div class="center-pin"></div>
  </div>
<div class="boot-text">
  <h2 id="bootStatus" class="glitch-text">ECU FLASHING...</h2>
    <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
   </div>
     </div>
  </main>
 <main class="hero hidden" id="ignitionScreen">
   <div class="container">
  <h1 class="title glitch" data-text="WELCOME TO THE WORLD OF HORSEPOWER">
      welcome to the world of horsepower
   </h1>
  <p class="subtitle type-writer" id="typeWriter"></p>
  <button class="ignition-btn" id="startEngineBtn">IGNITION <span class="blink">_</span></button>
    </div>
  </main>
    <main class="desktop-environment hidden" id="desktopScreen">
    <nav class="top-bar">
  <div class="bar-left">
     <span class="os-logo">AUTO_OS <span class="version">v1.3</span></span>
        </div>
 <div class="bar-center telemetry">
    <div class="stat"><span class="label">CPU</span> <span class="value">BOOST <span id="topBarBoost">14</span>psi</span></div>
           <div class="stat"><span class="label">RAM</span> <span class="value">TEMP 85°C</span></div>
       </div>
   <div class="bar-right">
      <span class="network status-icon">ONLINE</span>
 <span class="battery status-icon">ALT 14.2V</span>
   </div>
    </nav>
 <div class="desktop-workspace">
     <div class="app-grid">
  <button class="app-icon" data-name="Engine Control">
      <div class="icon-shape settings"></div><span>Settings</span>
     </button>
  <button class="app-icon" data-name="Telemetry">
       <div class="icon-shape telemetry-icon"></div><span>Monitor</span>
    </button>
  <button class="app-icon" data-name="Nav System">
           <div class="icon-shape nav"></div>
 <span>Navigation</span>
          </button>
      <button class="app-icon" data-name="Media Deck">
            <div class="icon-shape media"></div><span>Media</span>
            </button>
          <button class="app-icon" data-name="Garage">
              <div class="icon-shape files"></div><span>Files</span>
            </button>
                <button class="app-icon" data-name="Calendar">
            <div class="icon-shape calendar-icon"></div><span>Calendar</span>
            </button>
        </div>

      <div class="widget-container">
            <div class="chronometer">
       <div class="ring outer-ring"></div>
                <div class="ring inner-ring"></div>
  <div class="time-display">
            <div class="date" id="dateDisplay">--</div>
               <div class="time" id="timeDisplay">
              <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span>
            </div>
           <div class="seconds-container">
                  <span id="seconds">00</span> <span id="ampm">AM</span>
          </div>
   </div>
    </div>
      </div>
   </div>
   </main>

    <script src="script.js"></script>
  </body>
</html>
