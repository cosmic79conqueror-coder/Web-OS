<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
    <title>WebOS</title>
    <link rel="icon" type="image/x-icon" href="images/Aeroplane logo.webp">
    <link rel="stylesheet" href="style.css">
</head>

<body
    style="background-image:url(images/Background.jpg);background-size:cover;background-repeat:no-repeat;background-position:center;background-attachment:fixed;">
    <!--Top Bar Below!!-->
    <div style="display:flex;justify-content:space-between;backdrop-filter: blur(5px); background-color: rgba(0, 94, 255, 0.25); color: #fff; justify-content: space-between;"
        id="top">
        <p style="margin:5px 20px 5px 20px;background-color:rgb(81, 154, 232);border-radius:20px;padding:4px;">WebOS
        </p>
        <img src="images/Aeroplane logo.webp" width="30px" height="30px">
        <p style="margin:5px 20px 5px 20px;background-color:rgb(81, 154, 232);border-radius:20px;padding:4px;"
            id="timeElement">00:00:00</p>
    </div>
    <!--Windows Below!!-->

    <div style="background-color:#0006ab;color:white;opacity:70%;border:solid;padding:10px;position:absolute;border-radius:10px;width:40%;top:50%;left:50%;transform:translate(-50%, -50%);"
        id="welcome">
        <div style="width:100%;background-color:rgb(78, 63, 243);opacity:70%;margin:0;border-radius:20px;cursor:pointer;height:20px;"
            id="welcomeheader">
            <p style="cursor: pointer;">
            <div id="welcomeclose" style="background-color:red;border-radius:20px;width:20px;height:20px;margin-top:0;">
            </div>
            </p>
        </div>
        <h1>WebOS</h1>
        <h2>A web-based operating system designed for aviation enthusiests!</h2>
        <p>I hope you enjoy the OS!</p>
    </div>


  

    <div style="background-color:#0b1d1e;color:white;border:solid;padding:10px;position:absolute;border-radius:10px;width:20%;top:50%;left:85%;transform:translate(-50%, -50%);display:none;height:45%;overflow-y:auto;"
        id="photos">
        <div style="width:100%;background-color:rgb(78, 63, 243);opacity:70%;margin:0;border-radius:20px;cursor:pointer;height:20px;"
            id="photosheader">
            <p style="cursor: pointer;">
            <div id="photosclose" style="background-color:red;border-radius:20px;width:20px;height:20px;margin-top:0;">
            </div>
            </p>
        </div>
        <h1>Aviation Photos!</h1>
        <img src="images/Aviation 1.jpg" width="200">
        <img src="images/Aviation 2.jpg" width="200">
        <img src="images/Aviation 3.jpg" width="200">
        <img src="images/Aviation 4.jpg" width="200">
        <img src="images/Aviation 5.jpg" width="200">
    </div>

    <div style="background-color:#000000;color:white;border:solid;padding:10px;position:absolute;border-radius:10px;width:20%;top:60%;left:35%;transform:translate(-50%, -50%);display:none;height:30%;"
        id="weather">
        <div style="width:100%;background-color:rgb(78, 63, 243);opacity:70%;margin:0;border-radius:20px;cursor:pointer;height:20px;"
            id="weatherheader">
            <p style="cursor: pointer;">
            <div id="weatherClose" style="background-color:red;border-radius:20px;width:20px;height:20px;margin-top:0;">
            </div>
            </p>
        </div>
        <h1 style="margin-bottom:0;">Weather</h1>
        <div id="weather-box" style="font-family:Arial; color:white; padding:10px;flex-shrink:0;">
            Weather incoming...
        </div>
        <script>
            async function loadWeather() {
                const box = document.getElementById("weather-box");

                navigator.geolocation.getCurrentPosition(async (pos) => {
                    try {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        const iframe = document.getElementById("map");


                        const weather = await fetch(
                            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
                        ).then(r => r.json());

                        const temp = weather.current_weather.temperature;
                        const wind = weather.current_weather.windspeed;
                        const code = weather.current_weather.weathercode;

                        box.innerHTML = `

                <h2><strong>${temp}C</strong></h2>
                <p>Wind: ${wind} km/h</p>
                <p>Condition code: ${code}</p>
            `;
                    } catch (e) {
                        box.innerHTML = "Weather unavailable.";
                    }
                }, () => {
                    box.innerHTML = "Location permission denied.";
                });
            }

            loadWeather();
        </script>

    </div>

    </div>

    <div style="background-color:#000000;color:white;border:solid;padding:10px;position:absolute;border-radius:10px;width:20%;top:40%;left:65%;transform:translate(-50%, -50%);display:none;height:20%;"
        id="settings">
        <div style="width:100%;background-color:rgb(78, 63, 243);opacity:70%;margin:0;border-radius:20px;cursor:pointer;height:20px;"
            id="settingsheader">
            <p style="cursor: pointer;">
            <div id="settingsClose"
                style="background-color:red;border-radius:20px;width:20px;height:20px;margin-top:0;">
            </div>
            </p>
        </div>
        <h1>Settings</h1>
        <input type="checkbox" id="hour" name="hour" value="12 Hour Time">
        <label for="hour">12 Hour Time</label>
    </div>


    <!--Bottom Bar-->
    <div
        style="display:flex;justify-content:center;backdrop-filter: blur(5px); background-color: rgba(0, 94, 255, 0.25);width:60%;color:#fff;position:fixed;bottom:2%;left:20%;border-radius:20px;">
        <p style="margin:5px 20px 5px 20px;background-color:rgb(255, 0, 0);border-radius:20px;padding:4px;cursor:pointer;"
            id="welcomeopen">WebOS</p>
        <p style="margin:5px 20px 5px 20px;background-color:rgb(255, 0, 0);border-radius:20px;padding:4px;cursor:pointer;"
            id="aboutMeScreenOpen">Flight Facts</p>
        <p style="margin:5px 20px 5px 20px;background-color:rgb(255, 0, 0);border-radius:20px;padding:4px;cursor:pointer;"
            id="photosScreenOpen">Avitation Photos</p>
        <p style="margin:5px 20px 5px 20px;background-color:rgb(255, 0, 0);border-radius:20px;padding:4px;cursor:pointer;"
            id="weatherOpen">Weather</p>
        <p style="margin:5px 20px 5px 20px;background-color:rgb(255, 0, 0);border-radius:20px;padding:4px;cursor:pointer;"
            id="settingsOpen">Settings</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
