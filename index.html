<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="hero-bg"></div>
  <div class="scanlines"></div>

  <section class="screen boot-screen" id="bootScreen">
    <div class="boot-card">
      <h1 class="glitch-text">TURBO OS</h1>
      <p id="bootStatus">INITIALIZING ECU...</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </section>

  <section class="screen home-screen hidden" id="homeScreen">
    <header class="top-nav">
      <div class="logo">TURBO OS</div>
      <div class="telemetry-info">
        <span>BOOST: <span id="topBoost">14</span> PSI</span>
        <span>TEMP: <span class="text-red">85°C</span></span>
        <span>STATUS: <span class="text-blue">ONLINE</span></span>
      </div>
      <div class="clock" id="clockDisplay">00:00:00</div>
    </header>

    <div class="workspace">
      <div class="left-panel">
        <div class="box">
          <h3>SETTINGS & ECU</h3>
          <div class="control-row">
            <label>Boost Target</label>
            <input type="range" id="boostRange" min="10" max="30" value="14">
          </div>
          <div class="control-row">
            <span>Drift Mode</span>
            <input type="checkbox" id="driftCheck">
          </div>
          <div class="control-row">
            <span>Launch Control</span>
            <input type="checkbox" id="launchCheck" checked>
          </div>
          <button class="btn" id="flashBtn">FLASH ECU</button>
        </div>

        <div class="box">
          <h3>MONITOR</h3>
          <p>RPM: <span class="text-red">8,450</span></p>
          <p>Oil Pressure: <span class="text-blue">NOMINAL</span></p>
          <p>GPS: PANVEL, MH</p>
        </div>
      </div>

      <div class="arcade-panel">
        <h3>ARCADE ZONE</h3>
        <p class="arcade-sub">TURBO CLICKER</p>
        <div class="score-display"><span id="scoreVal">0</span> RPM</div>
        <div class="timer-display">TIME: <span id="timerVal">15</span>s</div>
        <button class="btn red-btn" id="arcadeBtn">JAM THROTTLE</button>
        <div class="high-score">HIGH SCORE: <span id="highScoreVal">0</span></div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
